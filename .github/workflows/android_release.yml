name: 'Release'

on:
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest

    outputs:
      version_code: ${{ steps.extract_version.outputs.version_code }}
      version_name: ${{ steps.extract_version.outputs.version_name }}

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Extract versions from build.gradle'
        id: extract_version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | sed 's/[^0-9]*//g')

          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | cut -d '"' -f 2)

          echo "Извлечено: versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

  prepare-changelog:
    runs-on: ubuntu-latest
    needs: get-version

    outputs:
      release_body: ${{ steps.generate_changelog.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 'Setup Python'
        uses: actions/setup-python@v6

      - name: 'Generate changelog'
        id: generate_changelog
        env:
          VERSION_CODE: ${{ needs.get-version.outputs.version_code }}
        run: |
          CHANGELOG_BODY=$(python .github/scripts/generate_changelog.py "$VERSION_CODE")
          DELIMITER=$(openssl rand -hex 16)
          
          echo "body<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_BODY" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Setup JDK 25'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6

      - name: 'Grant execution permission to Gradle Wrapper'
        run: chmod +x gradlew

      - name: 'Build release .apk'
        run: ./gradlew assembleRelease

      - name: 'Sign release .apk'
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 'Rename signed .apk'
        env:
          SIGNED_APK_FILE: ${{ steps.sign_apk.outputs.signedFile }}
        run: |
          test -n "$SIGNED_APK_FILE" && test -f "$SIGNED_APK_FILE"
          mv -- "$SIGNED_APK_FILE" "HomeMedkit.apk"

      - name: 'Upload APK as artifact'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: HomeMedkit.apk

  create-release:
    runs-on: ubuntu-latest
    needs: [ get-version, prepare-changelog, build ]
    permissions:
      contents: write

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 'Download .apk artifact'
        uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: 'Push Tag'
        env:
          VERSION_NAME: ${{ needs.get-version.outputs.version_name }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag "$VERSION_NAME"
          
          git push origin "$VERSION_NAME"

      - name: 'Create GitHub release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version.outputs.version_name }}
          body: ${{ needs.prepare-changelog.outputs.release_body }}
          files: HomeMedkit.apk

  deploy-rustore:
    runs-on: ubuntu-latest
    needs: [ get-version, build, create-release ]

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Download HomeMedkit.apk'
        uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: 'Read changelog'
        id: read_changelog
        env:
          VERSION_CODE: ${{ needs.get-version.outputs.version_code }}
        run: |
          CHANGELOG_PATH="fastlane/metadata/android/ru/changelogs/${VERSION_CODE}.txt"
          
          EOF=$(openssl rand -hex 8)
          
          echo "WHATS_NEW<<$EOF" >> "$GITHUB_ENV"
          if [ -f "$CHANGELOG_PATH" ]; then
            cat "$CHANGELOG_PATH" >> "$GITHUB_ENV"
            echo "" >> "$GITHUB_ENV"
          else
            echo "— Это техническое обновление без изменений в интерфейсе." >> "$GITHUB_ENV"
          fi
          echo "$EOF" >> "$GITHUB_ENV"

      - name: 'RuStore Publish'
        id: rustore_publish
        uses: Suro4ek/rustore-action@v0.0.1
        with:
          key_id: ${{ secrets.RUSTORE_KEY_ID }}
          private_key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          publish_type: 'INSTANTLY'
          application_id: 'ru.application.homemedkit'
          file: 'HomeMedkit.apk'
          whats_new: ${{ env.WHATS_NEW }}

      - name: 'Print RuStore Result'
        env:
          VERSION_ID: ${{ steps.rustore_publish.outputs.version_id }}
          PUBLISH_STATUS: ${{ steps.rustore_publish.outputs.status }}
        run: |
          printf 'RuStore version ID: %s\nRuStore статус: %s\n' "$VERSION_ID" "$PUBLISH_STATUS"